# Runs the grant collector every day at 03:00 UTC on GitHub's free runners.
# Add the secrets in GitHub: Settings -> Secrets and variables -> Actions.
name: collect-grants
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      SIMPLER_GRANTS_API_KEY: ${{ secrets.SIMPLER_GRANTS_API_KEY }}
      # Free-tier Cloudflare Workers AI defaults; override by setting the
      # matching repo secret (empty/unset secret falls back to the literal).
      AI_EXTRACT_MODEL: ${{ secrets.AI_EXTRACT_MODEL || '@cf/qwen/qwen3-30b-a3b-fp8' }}
      AI_EMBED_MODEL: ${{ secrets.AI_EMBED_MODEL || '@cf/baai/bge-m3' }}
      AI_WRITER_MODEL: ${{ secrets.AI_WRITER_MODEL || '@cf/qwen/qwen3-30b-a3b-fp8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt && crawl4ai-setup
      - run: python collector/pipeline.py collect
      - run: python collector/pipeline.py extract
      - run: python collector/pipeline.py embed
